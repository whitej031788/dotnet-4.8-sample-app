name: Build

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-and-analyze:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET (for tool installation)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install SonarScanner for .NET
        shell: pwsh
        run: |
          dotnet tool install --global dotnet-sonarscanner
          echo "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages (packages.config)
        shell: pwsh
        run: nuget restore DescopeSampleApp.sln -NonInteractive -Verbosity detailed

    # Optional belt-and-braces: ensure the exact missing package exists
      - name: Ensure Microsoft.CodeDom package is present
        shell: pwsh
        run: nuget install Microsoft.CodeDom.Providers.DotNetCompilerPlatform -Version 2.0.1 -OutputDirectory packages

      - name: SonarQube Begin
        shell: pwsh
        run: >
          dotnet-sonarscanner begin
          /k:"whitej031788_dotnet-4.8-sample-app_87709443-20be-4a40-a0af-bbd396fa8355"
          /d:sonar.host.url="${{ secrets.SONAR_HOST_URL }}"
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
          /d:sonar.verbose=true
          /d:sonar.scm.exclusions.disabled=true
          /d:sonar.sca.resolveAsRoot=true

      - name: Build (MSBuild)
        shell: pwsh
        run: msbuild DescopeSampleApp.sln /t:Rebuild /p:Configuration=Release /p:UseSharedCompilation=false

      - name: SonarQube End
        shell: pwsh
        run: >
          dotnet-sonarscanner end
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}"